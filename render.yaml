# Render Blueprint for the API. Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: awards-adjudication-api
    runtime: node
    buildCommand: npm ci && npm run build -w shared && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
